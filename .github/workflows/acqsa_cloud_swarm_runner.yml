          TELEGRAM_CHAT_ID: "8976047512"
          SMTP_HOST: "smtp.hostinger.com"
          SMTP_PORT: "465"
          SMTP_USER: "ceo@acqsaai.com"
          SMTP_PASS: "9030531872@Ajay"
        run: |
          python3 client_acquisition_swarm/swarm_master_runner.py --single

      - name: Verify Live Telemetry
