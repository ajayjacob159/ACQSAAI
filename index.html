<!DOCTYPE html>
<html lang="en" class="light scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <title>ACQSA AI | LinkedIn Demand Generation for B2B Founders</title>
    <meta name="description" content="ACQSA AI helps founder-led B2B companies turn LinkedIn into a predictable source of qualified sales conversations through ICP targeting, account research, decision-maker outreach and structured follow-up." />
    
    <!-- PWA & Mobile Web App Meta -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ACQSA AI" />
    <link rel="apple-touch-icon" href="/icon.png" />

    <!-- Open Graph / Meta -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ACQSA AI | LinkedIn Demand Generation for B2B Founders" />
    <meta property="og:description" content="Turn LinkedIn into your B2B sales pipeline through ICP targeting, decision-maker outreach, and qualified conversation booking." />
    <meta property="og:image" content="/icon.png" />
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#FAFAFC] text-[#0F172A] font-sans antialiased selection:bg-[#FF1B6B]/20 selection:text-[#FF1B6B] overflow-x-hidden">
    <div id="root"></div>

    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            console.log('ACQSA AI Service Worker Registered:', reg.scope);
          }).catch((err) => {
            console.log('Service Worker Registration Failed:', err);
          });
        });
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
